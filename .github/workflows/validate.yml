name: Validate data bank

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate data bank integrity
        run: python3 scripts/validate_data.py
      - name: Sequence index is fresh
        run: python3 scripts/build_sequence_index.py --check
      - name: Unit tests (mastery, errors, core)
        run: node tests/run.js
