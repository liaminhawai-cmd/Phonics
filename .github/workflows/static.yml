# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build sounds manifest
        run: |
          python3 - <<'EOF'
          import json, pathlib
          base = pathlib.Path('sounds')
          exts = {'.mp3', '.m4a', '.wav', '.ogg', '.webm'}
          manifest = {}
          if base.is_dir():
              for folder in sorted(base.iterdir()):
                  if not folder.is_dir():
                      continue
                  files = sorted(f.name for f in folder.iterdir()
                                 if f.is_file() and f.suffix.lower() in exts)
                  words = []
                  wdir = folder / 'words'
                  if wdir.is_dir():
                      words = sorted(f.name for f in wdir.iterdir()
                                     if f.is_file() and f.suffix.lower() in exts)
                  if files or words:
                      manifest[folder.name] = {'files': files, 'words': words}
          out = base / 'manifest.json'
          out.parent.mkdir(exist_ok=True)
          out.write_text(json.dumps(manifest, ensure_ascii=False, indent=1))
          print('manifest:', len(manifest), 'sound folders with audio')
          EOF
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
