<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    a { color: #a83232; } a:hover { color: #7c2424; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #f4efe6; padding: 20px 16px; box-sizing: border-box; color: #1f1f1f; display: flex; flex-direction: column; gap: 14px;">

  <div>
    <h1 style="font-family: Georgia, 'Times New Roman', serif; font-size: 22px; letter-spacing: 0.5px; margin: 0; text-align: center;">G'day, Asha!</h1>
    <p style="margin: 4px 0 0; text-align: center; font-size: 12px; color: #6b6256; font-weight: 600;">ELC Bookmarks &middot; Level 6</p>
  </div>

  <!-- READING door -->
  <div style="flex: 1; background: #fbf7ee; border: 1.5px solid #4a6d9b; border-radius: 14px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); padding: 16px; display: flex; flex-direction: column; gap: 10px;">
    <div style="display: flex; align-items: center; gap: 12px;">
      <div style="width: 52px; height: 52px; border-radius: 14px; background: #e9eef6; border: 1px solid #c4d1e2; display: flex; align-items: center; justify-content: center; flex: 0 0 auto;">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#4a6d9b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg>
      </div>
      <div>
        <div style="font-family: Georgia, serif; font-weight: 700; font-size: 19px;">Reading</div>
        <div style="font-size: 12px; color: #6b6256;">letters &rarr; sounds &rarr; words</div>
      </div>
      <div style="margin-left: auto; text-align: right;">
        <div style="font-family: Georgia, serif; font-weight: 700; font-size: 16px; color: #4a6d9b;">26</div>
        <div style="font-size: 10px; color: #6b6256;">letters gold</div>
      </div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 7px;">
      <button style="display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 8px 14px; border: 1px solid #d8cfbb; border-radius: 12px; background: #ffffff; font-family: inherit; font-size: 14px; font-weight: 700; color: #1f1f1f; text-align: left;">
        <span style="width: 22px; height: 30px; background: #84b063; border-radius: 2px 2px 4px 4px; display: inline-block; flex: 0 0 auto;"></span>
        My letters <span style="font-weight: 400; color: #6b6256; font-size: 12px;">&middot; the bookmark wall</span>
        <span style="margin-left: auto; color: #6b6256;">&rsaquo;</span>
      </button>
      <button style="display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 8px 14px; border: 1px solid #d8cfbb; border-radius: 12px; background: #ffffff; font-family: inherit; font-size: 14px; font-weight: 700; color: #1f1f1f; text-align: left;">
        <span style="display: inline-flex; gap: 2px; flex: 0 0 auto;"><span style="width: 12px; height: 16px; border: 1.5px solid #4a6d9b; border-radius: 3px;"></span><span style="width: 12px; height: 16px; border: 1.5px solid #4a6d9b; border-radius: 3px;"></span><span style="width: 12px; height: 16px; border: 1.5px solid #4a6d9b; border-radius: 3px;"></span></span>
        Break words into sounds <span style="font-weight: 400; color: #6b6256; font-size: 12px;">&middot; sound boxes</span>
        <span style="margin-left: auto; color: #6b6256;">&rsaquo;</span>
      </button>
      <button style="display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 8px 14px; border: 1px solid #d8cfbb; border-radius: 12px; background: #ffffff; font-family: inherit; font-size: 14px; font-weight: 700; color: #1f1f1f; text-align: left;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4a6d9b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex: 0 0 auto;"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
        Read words &amp; cards <span style="font-weight: 400; color: #6b6256; font-size: 12px;">&middot; only sounds I know</span>
        <span style="margin-left: auto; color: #6b6256;">&rsaquo;</span>
      </button>
    </div>
  </div>

  <!-- SPELLING door -->
  <div style="flex: 1; background: #fbf7ee; border: 1.5px solid #8a5d95; border-radius: 14px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); padding: 16px; display: flex; flex-direction: column; gap: 10px;">
    <div style="display: flex; align-items: center; gap: 12px;">
      <div style="width: 52px; height: 52px; border-radius: 14px; background: #f0e9f3; border: 1px solid #d5c5dc; display: flex; align-items: center; justify-content: center; flex: 0 0 auto;">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#8a5d95" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 9a5 5 0 0 0-10 0c0 5 4 4.4 4 8a2.5 2.5 0 0 0 5 0"></path><path d="M13.8 9.2a1.8 1.8 0 0 0-3.6 0"></path></svg>
      </div>
      <div>
        <div style="font-family: Georgia, serif; font-weight: 700; font-size: 19px;">Spelling</div>
        <div style="font-size: 12px; color: #6b6256;">sounds &rarr; letters &rarr; words</div>
      </div>
      <div style="margin-left: auto; text-align: right;">
        <div style="font-family: Georgia, serif; font-weight: 700; font-size: 16px; color: #8a5d95;">18</div>
        <div style="font-size: 10px; color: #6b6256;">sounds I own</div>
      </div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 7px;">
      <button style="display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 8px 14px; border: 1px solid #d8cfbb; border-radius: 12px; background: #ffffff; font-family: inherit; font-size: 14px; font-weight: 700; color: #1f1f1f; text-align: left;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8a5d95" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex: 0 0 auto;"><circle cx="12" cy="12" r="9"></circle><path d="M8 13c1 1.5 2.5 2.2 4 2.2s3-.7 4-2.2"></path><circle cx="9" cy="9.5" r="0.8" fill="#8a5d95"></circle><circle cx="15" cy="9.5" r="0.8" fill="#8a5d95"></circle></svg>
        My sounds <span style="font-weight: 400; color: #6b6256; font-size: 12px;">&middot; mouths &amp; spellings</span>
        <span style="margin-left: auto; color: #6b6256;">&rsaquo;</span>
      </button>
      <button style="display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 8px 14px; border: 1px solid #d8cfbb; border-radius: 12px; background: #ffffff; font-family: inherit; font-size: 14px; font-weight: 700; color: #1f1f1f; text-align: left;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8a5d95" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex: 0 0 auto;"><path d="M11 5 6 9H2v6h4l5 4z" fill="none"></path><path d="M15.5 8.5a5 5 0 0 1 0 7"></path></svg>
        Listen &amp; write <span style="font-weight: 400; color: #6b6256; font-size: 12px;">&middot; boxes &amp; counters</span>
        <span style="margin-left: auto; color: #6b6256;">&rsaquo;</span>
      </button>
      <button style="display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 8px 14px; border: 1px solid #d8cfbb; border-radius: 12px; background: #ffffff; font-family: inherit; font-size: 14px; font-weight: 700; color: #1f1f1f; text-align: left;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8a5d95" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex: 0 0 auto;"><path d="M12 3l1.9 4.6 4.9.4-3.7 3.2 1.1 4.8L12 13.5 7.8 16l1.1-4.8L5.2 8l4.9-.4z"></path></svg>
        Spelling rules <span style="font-weight: 400; color: #6b6256; font-size: 12px;">&middot; magic e &amp; friends</span>
        <span style="margin-left: auto; color: #6b6256;">&rsaquo;</span>
      </button>
    </div>
  </div>

  <!-- HANDWRITING strip -->
  <button style="display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 10px 16px; border: 1.5px solid #3d7d62; border-radius: 14px; background: #fbf7ee; font-family: inherit; text-align: left; box-shadow: 0 2px 12px rgba(0,0,0,0.06);">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#3d7d62" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex: 0 0 auto;"><path d="M12 20h9"></path><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"></path></svg>
    <span style="font-family: Georgia, serif; font-weight: 700; font-size: 16px; color: #1f1f1f;">Handwriting</span>
    <span style="font-size: 12px; color: #6b6256;">loops &middot; sticks &middot; tails</span>
    <span style="margin-left: auto; font-size: 12px; font-weight: 700; color: #3d7d62;">12 / 26 letters &rsaquo;</span>
  </button>
</div>
</x-dc>
</body>
</html>
