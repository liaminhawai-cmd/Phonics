<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    a { color: #a83232; } a:hover { color: #7c2424; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #f4efe6; padding: 20px 16px; box-sizing: border-box; color: #1f1f1f; display: flex; flex-direction: column; gap: 14px;">

  <div>
    <h1 style="font-family: Georgia, 'Times New Roman', serif; font-size: 22px; letter-spacing: 0.5px; margin: 0; text-align: center;">My Progress</h1>
    <p style="margin: 4px 0 0; text-align: center; font-size: 12px; color: #6b6256; font-weight: 600;">Asha &middot; ELC Bookmarks</p>
  </div>

  <!-- the flip: Sounds face -->
  <div style="display: flex; background: #eee4d0; border-radius: 24px; padding: 4px;">
    <button style="flex: 1; min-height: 44px; border: none; border-radius: 20px; background: transparent; color: #6b6256; font-weight: 700; font-size: 14px; font-family: inherit; display: flex; align-items: center; justify-content: center; gap: 7px;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#4a6d9b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg>
      Letters
    </button>
    <button style="flex: 1; min-height: 44px; border: none; border-radius: 20px; background: #8a5d95; color: #fbf7ee; font-weight: 700; font-size: 14px; font-family: inherit; display: flex; align-items: center; justify-content: center; gap: 7px;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fbf7ee" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 9a5 5 0 0 0-10 0c0 5 4 4.4 4 8a2.5 2.5 0 0 0 5 0"></path><path d="M13.8 9.2a1.8 1.8 0 0 0-3.6 0"></path></svg>
      Sounds
    </button>
  </div>

  <!-- the same one action -->
  <button style="display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 10px 16px; border: none; border-radius: 14px; background: #a83232; color: #fbf7ee; font-family: inherit; text-align: left; box-shadow: 0 2px 12px rgba(0,0,0,0.10);">
    <div style="position: relative; width: 40px; height: 40px; flex: 0 0 auto;">
      <svg width="40" height="40" viewBox="0 0 64 64" style="position: absolute; inset: 0;"><circle cx="32" cy="32" r="27" fill="none" stroke="rgba(251,247,238,0.35)" stroke-width="6"></circle><circle cx="32" cy="32" r="27" fill="none" stroke="#fbf7ee" stroke-width="6" stroke-linecap="round" stroke-dasharray="110 59.6" stroke-dashoffset="0" transform="rotate(-90 32 32)"></circle></svg>
      <div style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: Georgia, serif; font-weight: 700; font-size: 12px; color: #fbf7ee;">/sh/</div>
    </div>
    <div>
      <div style="font-weight: 800; font-size: 15px;">Keep going</div>
      <div style="font-size: 12px; opacity: 0.9;">One ring to close on /sh/ &mdash; spell it 3 times</div>
    </div>
    <span style="margin-left: auto; font-size: 20px;">&rsaquo;</span>
  </button>

  <!-- sound wall: working set -->
  <div style="background: #fbf7ee; border: 1px solid #d8cfbb; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); overflow: hidden;">
    <div style="background: #8a5d95; padding: 8px 14px; display: flex; justify-content: space-between; align-items: center;">
      <span style="font-family: Georgia, serif; font-weight: 700; font-size: 14px; color: #fbf7ee;">My sounds now</span>
      <span style="font-size: 11px; font-weight: 700; color: #fbf7ee;">18 owned &middot; 4 learning</span>
    </div>

    <!-- /sh/ learning row -->
    <div style="display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px dashed #e8e0cd;">
      <svg width="44" height="44" viewBox="0 0 48 48" style="flex: 0 0 auto;">
        <circle cx="24" cy="24" r="20" fill="#fdf3e3" stroke="#1f1f1f" stroke-width="1.6"></circle>
        <circle cx="17.5" cy="19" r="1.7" fill="#1f1f1f"></circle><circle cx="30.5" cy="19" r="1.7" fill="#1f1f1f"></circle>
        <ellipse cx="24" cy="31" rx="5.5" ry="3.4" fill="#ffffff" stroke="#1f1f1f" stroke-width="1.6"></ellipse>
      </svg>
      <span style="font-family: Georgia, serif; font-weight: 700; font-size: 17px; flex: 0 0 auto;">/sh/</span>
      <div style="display: flex; gap: 5px; flex: 1; flex-wrap: wrap;">
        <span style="border: 1.5px solid #8a5d95; border-radius: 7px; padding: 2px 9px; font-family: Georgia, serif; font-weight: 700; font-size: 14px;">sh</span>
      </div>
      <div style="position: relative; width: 40px; height: 40px; flex: 0 0 auto;">
        <svg width="40" height="40" viewBox="0 0 64 64" style="position: absolute; inset: 0;"><circle cx="32" cy="32" r="27" fill="none" stroke="#eee4d0" stroke-width="6"></circle><circle cx="32" cy="32" r="27" fill="none" stroke="#8a5d95" stroke-width="6" stroke-linecap="round" stroke-dasharray="110 59.6" stroke-dashoffset="0" transform="rotate(-90 32 32)"></circle></svg>
      </div>
    </div>

    <!-- /ay/ learning row with MOVE ME -->
    <div style="display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px dashed #e8e0cd;">
      <div style="position: relative; flex: 0 0 auto;">
        <svg width="44" height="44" viewBox="0 0 48 48">
          <circle cx="24" cy="24" r="20" fill="#fdf3e3" stroke="#1f1f1f" stroke-width="1.6"></circle>
          <circle cx="17.5" cy="19" r="1.7" fill="#1f1f1f"></circle><circle cx="30.5" cy="19" r="1.7" fill="#1f1f1f"></circle>
          <path d="M16 29 Q24 38 32 29 Q24 33 16 29 Z" fill="#ffffff" stroke="#1f1f1f" stroke-width="1.6" stroke-linejoin="round"></path>
        </svg>
        <span style="position: absolute; right: -4px; bottom: -4px; background: #8a5d95; color: #fbf7ee; border-radius: 8px; font-size: 7.5px; font-weight: 800; padding: 2px 5px;">MOVE</span>
      </div>
      <span style="font-family: Georgia, serif; font-weight: 700; font-size: 17px; flex: 0 0 auto;">/ay/</span>
      <div style="display: flex; gap: 5px; flex: 1; flex-wrap: wrap;">
        <span style="border: 1.5px solid #b8860b; background: #f5c33c; border-radius: 7px; padding: 2px 9px; font-family: Georgia, serif; font-weight: 700; font-size: 14px; color: #4a3305;">ay</span>
        <span style="border: 1.5px dashed #d8cfbb; border-radius: 7px; padding: 2px 9px; font-family: Georgia, serif; font-weight: 700; font-size: 14px; color: #b3a892;">ai</span>
      </div>
      <div style="position: relative; width: 40px; height: 40px; flex: 0 0 auto;">
        <svg width="40" height="40" viewBox="0 0 64 64" style="position: absolute; inset: 0;"><circle cx="32" cy="32" r="27" fill="none" stroke="#eee4d0" stroke-width="6"></circle><circle cx="32" cy="32" r="27" fill="none" stroke="#8a5d95" stroke-width="6" stroke-linecap="round" stroke-dasharray="40 129.6" stroke-dashoffset="0" transform="rotate(-90 32 32)"></circle></svg>
      </div>
    </div>

    <!-- owned strip: compact gold row -->
    <div style="padding: 10px 14px;">
      <div style="font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: #6b6256; margin-bottom: 7px;">Owned &mdash; tap to hear</div>
      <div style="display: flex; flex-wrap: wrap; gap: 6px;">
        <span style="min-width: 44px; min-height: 44px; display: inline-flex; align-items: center; justify-content: center; background: #f5c33c; border: 1.5px solid #b8860b; border-radius: 50%; font-family: Georgia, serif; font-weight: 700; font-size: 13px; color: #4a3305;">/s/</span>
        <span style="min-width: 44px; min-height: 44px; display: inline-flex; align-items: center; justify-content: center; background: #f5c33c; border: 1.5px solid #b8860b; border-radius: 50%; font-family: Georgia, serif; font-weight: 700; font-size: 13px; color: #4a3305;">/a/</span>
        <span style="min-width: 44px; min-height: 44px; display: inline-flex; align-items: center; justify-content: center; background: #f5c33c; border: 1.5px solid #b8860b; border-radius: 50%; font-family: Georgia, serif; font-weight: 700; font-size: 13px; color: #4a3305;">/t/</span>
        <span style="min-width: 44px; min-height: 44px; display: inline-flex; align-items: center; justify-content: center; background: #f5c33c; border: 1.5px solid #b8860b; border-radius: 50%; font-family: Georgia, serif; font-weight: 700; font-size: 13px; color: #4a3305;">/p/</span>
        <span style="min-width: 44px; min-height: 44px; display: inline-flex; align-items: center; justify-content: center; background: #f5c33c; border: 1.5px solid #b8860b; border-radius: 50%; font-family: Georgia, serif; font-weight: 700; font-size: 13px; color: #4a3305;">/i/</span>
        <span style="min-width: 44px; min-height: 44px; display: inline-flex; align-items: center; justify-content: center; background: #f5c33c; border: 1.5px solid #b8860b; border-radius: 50%; font-family: Georgia, serif; font-weight: 700; font-size: 13px; color: #4a3305;">/n/</span>
        <span style="min-width: 44px; min-height: 44px; display: inline-flex; align-items: center; justify-content: center; background: #f5c33c; border: 1.5px solid #b8860b; border-radius: 50%; font-family: Georgia, serif; font-weight: 700; font-size: 13px; color: #4a3305;">/m/</span>
        <span style="min-width: 44px; min-height: 44px; display: inline-flex; align-items: center; justify-content: center; border: 1.5px solid #d8cfbb; border-radius: 50%; font-size: 12px; color: #6b6256; font-weight: 700;">+11</span>
      </div>
    </div>
  </div>

  <!-- coming up -->
  <div style="display: flex; align-items: center; gap: 8px; padding: 0 4px;">
    <span style="font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: #6b6256;">Next sounds</span>
    <span style="font-size: 13px; color: #b3a892; font-family: Georgia, serif; font-weight: 700;">/w/ &middot; /k/+ck &middot; /ee/ &middot; /er/ &middot; /ar/</span>
  </div>

  <!-- quiet nav -->
  <div style="margin-top: auto; display: flex; justify-content: center; gap: 10px; padding-top: 8px; border-top: 1px dashed #e8e0cd;">
    <a href="#" style="min-height: 44px; display: inline-flex; align-items: center; padding: 0 10px; font-size: 13px; font-weight: 700; text-decoration: none;">Practise</a>
    <a href="#" style="min-height: 44px; display: inline-flex; align-items: center; padding: 0 10px; font-size: 13px; font-weight: 700; text-decoration: none;">Handwriting</a>
    <a href="#" style="min-height: 44px; display: inline-flex; align-items: center; padding: 0 10px; font-size: 13px; font-weight: 700; color: #6b6256; text-decoration: none;">Grown-ups</a>
  </div>
</div>
</x-dc>
</body>
</html>
