<body>
<x-dc>
<helmet>

<div style="width: 390px; height: 844px; background: #f4efe6; padding: 20px 16px; box-sizing: border-box; color: #1f1f1f; display: flex; flex-direction: column; gap: 14px;">

      Sounds
    </button>
  </div>

  <!-- the one action -->
  <button style="display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 10px 16px; border: none; border-radius: 14px; background: #a83232; color: #fbf7ee; font-family: inherit; text-align: left; box-shadow: 0 2px 12px rgba(0,0,0,0.10);">
    <div style="position: relative; width: 40px; height: 40px; flex: 0 0 auto;">
      <svg width="40" height="40" viewBox="0 0 64 64" style="position: absolute; inset: 0;"><circle cx="32" cy="32" r="27" fill="none" stroke="rgba(251,247,238,0.35)" stroke-width="6"></circle><circle cx="32" cy="32" r="27" fill="none" stroke="#fbf7ee" stroke-width="6" stroke-linecap="round" stroke-dasharray="110 59.6" stroke-dashoffset="0" transform="rotate(-90 32 32)"></circle></svg>
      <div style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: Georgia, serif; font-weight: 700; font-size: 14px; color: #fbf7ee;">sh</div>
    </div>
    <div>
      <div style="font-weight: 800; font-size: 15px;">Keep going</div>
      <div style="font-size: 12px; opacity: 0.9;">One ring to close on sh &mdash; spell it 3 times</div>
    </div>
    <span style="margin-left: auto; font-size: 20px;">&rsaquo;</span>
  </button>

  <!-- working set: current level only -->
  <div style="background: #fbf7ee; border: 1px solid #d8cfbb; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); overflow: hidden;">
    <div style="background: #84b063; padding: 8px 14px; display: flex; justify-content: space-between; align-items: center;">
      <span style="font-family: Georgia, serif; font-weight: 700; font-size: 14px; color: #1f2e15;">Level 6 &middot; my letters now</span>
      <span style="font-size: 11px; font-weight: 700; color: #1f2e15;">1 of 5 gold</span>
    </div>
    <div style="display: flex; justify-content: space-between; padding: 16px 14px;">
      <div style="position: relative; width: 60px; height: 60px;"><svg width="60" height="60" viewBox="0 0 64 64" style="position: absolute; inset: 0;"><circle cx="32" cy="32" r="28" fill="#f5c33c" stroke="#b8860b" stroke-width="3"></circle></svg><div style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: Georgia, serif; font-weight: 700; font-size: 17px; color: #4a3305;">qu</div></div>
      <div style="position: relative; width: 60px; height: 60px;"><svg width="60" height="60" viewBox="0 0 64 64" style="position: absolute; inset: 0;"><circle cx="32" cy="32" r="29" fill="none" stroke="#eee4d0" stroke-width="4"></circle><circle cx="32" cy="32" r="24" fill="none" stroke="#eee4d0" stroke-width="4"></circle><circle cx="32" cy="32" r="19" fill="none" stroke="#eee4d0" stroke-width="4"></circle><circle cx="32" cy="32" r="29" fill="none" stroke="#4a6d9b" stroke-width="4" stroke-linecap="round" stroke-dasharray="182.2" stroke-dashoffset="18.2" transform="rotate(-90 32 32)"></circle><circle cx="32" cy="32" r="24" fill="none" stroke="#8a5d95" stroke-width="4" stroke-linecap="round" stroke-dasharray="150.8" stroke-dashoffset="52.8" transform="rotate(-90 32 32)"></circle><circle cx="32" cy="32" r="19" fill="none" stroke="#3d7d62" stroke-width="4" stroke-linecap="round" stroke-dasharray="119.4" stroke-dashoffset="83.6" transform="rotate(-90 32 32)"></circle></svg><div style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: Georgia, serif; font-weight: 700; font-size: 17px;">sh</div></div>
      <div style="position: relative; width: 60px; height: 60px;"><svg width="60" height="60" viewBox="0 0 64 64" style="position: absolute; inset: 0;"><circle cx="32" cy="32" r="29" fill="none" stroke="#eee4d0" stroke-width="4"></circle><circle cx="32" cy="32" r="24" fill="none" stroke="#eee4d0" stroke-width="4"></circle><circle cx="32" cy="32" r="19" fill="none" stroke="#eee4d0" stroke-width="4"></circle><circle cx="32" cy="32" r="29" fill="none" stroke="#4a6d9b" stroke-width="4" stroke-linecap="round" stroke-dasharray="182.2" stroke-dashoffset="91.1" transform="rotate(-90 32 32)"></circle><circle cx="32" cy="32" r="24" fill="none" stroke="#8a5d95" stroke-width="4" stroke-linecap="round" stroke-dasharray="150.8" stroke-dashoffset="105.6" transform="rotate(-90 32 32)"></circle></svg><div style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: Georgia, serif; font-weight: 700; font-size: 17px;">th</div></div>
      <div style="position: relative; width: 60px; height: 60px;"><svg width="60" height="60" viewBox="0 0 64 64" style="position: absolute; inset: 0;"><circle cx="32" cy="32" r="29" fill="none" stroke="#eee4d0" stroke-width="4"></circle><circle cx="32" cy="32" r="24" fill="none" stroke="#eee4d0" stroke-width="4"></circle><circle cx="32" cy="32" r="19" fill="none" stroke="#eee4d0" stroke-width="4"></circle><circle cx="32" cy="32" r="29" fill="none" stroke="#4a6d9b" stroke-width="4" stroke-linecap="round" stroke-dasharray="182.2" stroke-dashoffset="145.8" transform="rotate(-90 32 32)"></circle></svg><div style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: Georgia, serif; font-weight: 700; font-size: 17px;">ch</div></div>
      <div style="position: relative; width: 60px; height: 60px;"><svg width="60" height="60" viewBox="0 0 64 64" style="position: absolute; inset: 0;"><circle cx="32" cy="32" r="29" fill="none" stroke="#eee4d0" stroke-width="4"></circle><circle cx="32" cy="32" r="24" fill="none" stroke="#eee4d0" stroke-width="4"></circle><circle cx="32" cy="32" r="19" fill="none" stroke="#eee4d0" stroke-width="4"></circle></svg><div style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: Georgia, serif; font-weight: 700; font-size: 17px; color: #6b6256;">ay</div></div>
    </div>
  </div>

  <!-- everything mastered: the shelf -->
  <div style="background: #fbf7ee; border: 1px solid #d8cfbb; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); padding: 12px 14px;">
    <div style="display: flex; justify-content: space-between; align-items: baseline;">
      <span style="font-family: Georgia, serif; font-weight: 700; font-size: 13px;">Earned</span>
      <span style="font-size: 11px; color: #6b6256; font-weight: 600;">26 letters gold &middot; tap to revisit</span>
    </div>
    <div style="display: flex; gap: 7px; margin-top: 8px; align-items: flex-end;">
      <div style="width: 20px; height: 52px; background: #cfe0f5; border: 1px solid #9db8d6; border-radius: 3px 3px 6px 6px; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 3px; font-size: 11px;">&#10003;</div>
      <div style="width: 20px; height: 52px; background: #5b9bd5; border: 1px solid #40749f; border-radius: 3px 3px 6px 6px; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 3px; font-size: 11px; color: #ffffff;">&#10003;</div>
      <div style="width: 20px; height: 52px; background: #dcd6ec; border: 1px solid #b0a7cc; border-radius: 3px 3px 6px 6px; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 3px; font-size: 11px;">&#10003;</div>
      <div style="width: 20px; height: 52px; background: #7c64b0; border: 1px solid #5c4a86; border-radius: 3px 3px 6px 6px; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 3px; font-size: 11px; color: #ffffff;">&#10003;</div>
      <div style="width: 20px; height: 52px; background: #d4e6c5; border: 1px solid #a6bd93; border-radius: 3px 3px 6px 6px; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 3px; font-size: 11px;">&#10003;</div>
      <div style="width: 20px; height: 52px; border: 1.5px solid #84b063; border-radius: 3px 3px 6px 6px; position: relative; overflow: hidden;"><div style="position: absolute; left: 0; right: 0; bottom: 0; height: 35%; background: #84b063;"></div></div>
      <div style="width: 20px; height: 52px; border: 1px dashed #d8cfbb; border-radius: 3px 3px 6px 6px;"></div>
      <div style="width: 20px; height: 52px; border: 1px dashed #d8cfbb; border-radius: 3px 3px 6px 6px;"></div>
      <div style="flex: 1; text-align: right; font-size: 11px; color: #6b6256; align-self: center;">+ 6 more</div>

  <!-- coming up: one quiet line -->
  <div style="display: flex; align-items: center; gap: 8px; padding: 0 4px;">
    <span style="font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: #6b6256;">Next</span>
    <span style="font-size: 13px; color: #b3a892; font-family: Georgia, serif; font-weight: 700;">wh &middot; ck &middot; ee &middot; er &middot; ar</span>
    <span style="margin-left: auto; font-size: 11px; color: #6b6256;">Level 7</span>
  </div>

  <!-- quiet nav -->
  <div style="margin-top: auto; display: flex; justify-content: center; gap: 10px; padding-top: 8px; border-top: 1px dashed #e8e0cd;">
    <a href="#" style="min-height: 44px; display: inline-flex; align-items: center; padding: 0 10px; font-size: 13px; font-weight: 700; text-decoration: none;">Practise</a>
    <a href="#" style="min-height: 44px; display: inline-flex; align-items: center; padding: 0 10px; font-size: 13px; font-weight: 700; text-decoration: none;">Handwriting</a>
    <a href="#" style="min-height: 44px; display: inline-flex; align-items: center; padding: 0 10px; font-size: 13px; font-weight: 700; color: #6b6256; text-decoration: none;">Grown-ups</a>
  </div>
</div>
